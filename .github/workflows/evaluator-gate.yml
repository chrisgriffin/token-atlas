name: Evaluator

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  evaluator:
    uses: chrisgriffin/workflows/.github/workflows/_reusable-evaluator-gate.yml@v1
    secrets:
      EVALUATOR_FIRE_TOKEN: ${{ secrets.EVALUATOR_FIRE_TOKEN }}
      AUTOFIX_FIRE_TOKEN: ${{ secrets.AUTOFIX_FIRE_TOKEN }}
      OPS_GH_TOKEN: ${{ secrets.OPS_GH_TOKEN }}
      # ops#1919: a user token, so the gate can resolve an inline finding thread.
      # Passed as TARGET_TOKEN, the name the reusable at v1 already declares; a
      # secret the callee does not declare fails the run at parse time.
      TARGET_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
