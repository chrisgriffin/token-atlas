name: Create GitHub Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    # id-token: write lets the called workflow publish to Open VSX by trusted
    # publishing (the run's OIDC token, no stored secret). Without it the
    # release went green with "Open VSX publish skipped: no OVSX_PAT secret,
    # and no id-token: write" (#87). Not unused: do not remove it.
    permissions:
      contents: write
      id-token: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-create-github-release.yml@v1
    with:
      node_version: "22"
      build_command: npm ci && npm run build && npm run package
      release_assets: ./*.vsix
      marketplace_packages: ./*.vsix
    # VSCE_PAT publishes to the VS Code Marketplace; unset, the called
    # workflow skips that registry with a notice. OVSX_PAT publishes to Open
    # VSX and is preferred over trusted publishing when set; unset, Open VSX
    # is published by trusted publishing, which fails red on a bad exchange.
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
