name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  dispatch:
    uses: chrisgriffin/workflows/.github/workflows/_reusable-claude-mention.yml@v1
    with:
      target: token-atlas
    secrets:
      OPS_GH_TOKEN: ${{ secrets.OPS_GH_TOKEN }}
